name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java 21 (Required by Capacitor 8 / Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle and sync Capacitor Android
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ziojdrmmvnpxgjrfrmbs.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_D_Hn7t084zz7kKk0pAZ2HA_4VUF75FF' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'sb_publishable_D_Hn7t084zz7kKk0pAZ2HA_4VUF75FF' }}
        run: |
          npm run build
          npx cap sync android

      - name: Build Android APK (Debug installable package)
        working-directory: ./android
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload SiamPOS-Pro APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiamPOS-Pro-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
